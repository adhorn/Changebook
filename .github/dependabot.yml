version: 2

updates:
  # Python (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    groups:
      # Group minor/patch updates into a single PR to reduce noise
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    ignore:
      # eslint 10 removed context.getFilename() and friends. eslint-plugin-react
      # (pulled in by eslint-config-next, latest 7.37.5 as of 2026-09) still
      # uses them and crashes at lint time. Re-enable once eslint-config-next
      # ships plugins that declare eslint ^10 in their peer range. See #56.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.x (via eslint-config-next) caps typescript at <6.1
      # and refuses to run on TS 7 ("typescript-eslint does not support TS 7.0").
      # Re-enable once eslint-config-next ships a typescript-eslint that
      # supports 7. See #89.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Docker
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    ignore:
      # Track Node LTS only; odd-numbered majors (25, 27, ...) are not LTS.
      # Bump the major by hand when moving to the next LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
