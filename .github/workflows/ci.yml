name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: changebook
          POSTGRES_PASSWORD: changebook
          POSTGRES_DB: changebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CHANGEBOOK_DATABASE_URL: postgresql://changebook:changebook@localhost:5432/changebook_test
      CHANGEBOOK_TEST_DATABASE_URL: postgresql://changebook:changebook@localhost:5432/changebook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v --tb=short

  backend-integration:
    name: Backend integration tests (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: changebook
          POSTGRES_PASSWORD: changebook
          POSTGRES_DB: changebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CHANGEBOOK_DATABASE_URL: postgresql://changebook:changebook@localhost:5432/changebook_test
      CHANGEBOOK_TEST_DATABASE_URL: postgresql://changebook:changebook@localhost:5432/changebook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration -v --tb=short

  migration-check:
    name: Migration check (models vs migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: changebook
          POSTGRES_PASSWORD: changebook
          POSTGRES_DB: changebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CHANGEBOOK_DATABASE_URL: postgresql://changebook:changebook@localhost:5432/changebook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # Bring the database to the latest migration, then verify the SQLAlchemy
      # models have no schema changes that a migration hasn't captured. If a
      # model was edited without a matching migration, `alembic check` exits
      # non-zero and this job fails — flagging the PR as needing a migration.
      - run: alembic upgrade head
      - run: alembic check

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: changebook
          POSTGRES_PASSWORD: changebook
          POSTGRES_DB: changebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U changebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CHANGEBOOK_DATABASE_URL: postgresql://changebook:changebook@localhost:5432/changebook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend
      # Playwright's webServer config starts both backend (port 8001) and
      # frontend (port 3001) with the correct DB URL and CORS settings.
      # No manual server management needed here.
      #
      # Reporters: "list" prints each test name and pass/fail status to the
      # log (so the run is legible at a glance); "github" adds inline
      # annotations on failures.
      - run: npx playwright test --reporter=list,github
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
